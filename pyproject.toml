[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.1.0"
description = "Autonomous multi-channel SDR with a manager control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.8",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "mcp>=1.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["backend*", "agents*", "rag*", "evals*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "seed"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --show-capture=no"
